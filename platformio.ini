; ESP32-S3-N16R8
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs
framework = arduino
monitor_speed = 115200
lib_deps = 
	fastled/FastLED@^3.10.3
	esp32async/AsyncTCP@^3.4.4
	esp32async/ESPAsyncWebServer@^3.7.8

; override default partition scheme with 16MB version
board_build.arduino.partitions = default_16MB.csv

; Set FLASH and PSRAM operation mode to QIO_OPI
board_build.arduino.memory_type = qio_opi

; Define macros to enable PSRAM support and set WiFi credentials via environment variables
build_flags = 
    -DBOARD_HAS_PSRAM
    -DWIFI_SSID=\"${sysenv.WIFI_SSID}\" ; SSID injected from system environment
    -DWIFI_PASS=\"${sysenv.WIFI_PASS}\" ; WiFi password injected from system environment
    -DLITTLEFS_SHOULD_FORMAT=0          ; Format LittleFS on boot (0/1)
    -DWEB_SERVER_PORT=80                ; Web server HTTP port
    -DLED_MANAGER_MAX_STRIPS=2          ; Maximum number of LED strips that can be registered in LedManager
    -DHOUSE_MAX_ELEMENTS=2              ; Maximum number of LightElement objects that House can contain (e.g. rooms or groups added directly to the house)
    -DROOM_MAX_ELEMENTS=2               ; Maximum number of LightElement objects that Room can contain (typically LightGroup objects)
    -DLIGHT_GROUP_MAX_STRIPS=2          ; Maximum number of Strip objects that LightGroup can contain
    -DJSON_BUILDER_BUFFER_SIZE=4096     ; Maximum JSON builder buffer size in bytes
    -DJSON_BUILDER_MAX_DEPTH=8          ; Maximum JSON nesting depth

; override flash size to match 16MB chip
board_upload.flash_size = 16MB
